language: en-US
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - master
  path_filters:
    - "!node_modules/**"
    - "!data/**"
    - "!.pkc/**"
    - "!package-lock.json"
    - "!**/*.lock"
    - "!assets/**"
  tools:
    eslint:
      enabled: false
chat:
  auto_reply: true
